ad{margin-bottom:18px}.pagehead h1{font-size:25px;line-height:1.2;margin:4px 0}.sub,.muted{color:var(--muted);font-size:12px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(145deg,#101f31,#0b1725);border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0}.card h3{font-size:13px;color:#cbd6e3;margin:0 0 13px}.metric{font-size:26px;font-weight:800;margin:5px 0}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.pill{border-radius:6px;padding:4px 7px;font-size:10px;font-weight:800}.pill.green{background:#07392f}.pill.red{background:#421b27}.pill.gold{background:#332711}.btn{border:1px solid #384a60;background:#14243a;color:#e9eef6;border-radius:8px;padding:10px 13px;font-weight:700}.btn.goldbtn{background:linear-gradient(110deg,#ffdf7a,#e9a82d);border:0;color:#16130b}.btn.full{width:100%;margin-top:10px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;color:#aab9ca}.field input,.field select,.field textarea{width:100%;background:#071321;color:#f5f7fb;border:1px solid #293c51;border-radius:8px;padding:10px}.field textarea{min-height:70px}.tools{display:flex;gap:7px;flex-wrap:wrap}.tools button{background:#0a1624;border:1px solid #293b50;color:#afbed0;border-radius:7px;padding:7px 13px;font-size:11px;font-weight:750}.tools button.active{background:var(--gold);color:#111;border-color:var(--gold)}.chartbox{margin-top:12px;background:#071321;border:1px solid #23364b;border-radius:10px;overflow:hidden}.chartbox canvas{width:100%;height:360px;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;color:#9db0c4;font-size:10px;margin-top:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:11px 8px;border-bottom:1px solid #223348;text-align:left;white-space:nowrap}.table th{color:#8fa3ba;font-size:10px}.listitem{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #223348;cursor:pointer}.listitem:last-child{border:0}.symbol{width:35px;height:35px;border-radius:9px;background:linear-gradient(135deg,#ffdf7a,#d88f19);color:#17130a;display:grid;place-items:center;font-weight:900}.desc{flex:1;min-width:0}.desc b{display:block;font-size:12px}.desc small{color:var(--muted);font-size:10px}.switch{appearance:none;width:38px;height:22px;border-radius:20px;background:#36465a;position:relative;cursor:pointer}.switch:checked{background:#0aa979}.switch:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:white;left:3px;top:3px}.switch:checked:before{left:19px}.checkrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #223348;gap:10px}.empty{text-align:center;padding:28px;color:var(--muted)}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(430px,100%);border:1px solid #3b3423;background:linear-gradient(150deg,#102033,#050b12);border-radius:20px;padding:28px}.loginlogo{text-align:center;margin-bottom:22px}.school-logo{display:block;width:min(100%,340px);height:auto;max-height:115px;object-fit:contain;margin:0 auto 16px}.brand-school{display:block;color:var(--muted);font-size:8px;letter-spacing:1.2px;margin-top:4px}.loginlogo .mark{font-size:58px}.loginlogo h1{letter-spacing:2px}.loginlogo em{color:var(--gold);font-style:normal}.loginlogo p{font-size:10px;letter-spacing:2px;color:var(--muted)}.bottomnav{display:none}@media(max-width:950px){.app{grid-template-columns:185px 1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:18px}}@media(max-width:650px){.app{display:block}.side{display:none}.top{height:60px;padding:0 13px}.content{pa </style></head><body><div id="root"></div><script>

const nav=[['home','⌂','Visão geral'],['market','▥','Mercado'],['trades','▤','Operações'],['signals','✦','Sinais'],['history','◷','Histórico'],['account','◉','Minha conta'],['connect','⇄','Conectar MT5'],['copy','⤳','Espelhamento'],['notifications','♧','Notificações'],['profile','☷','Perfil']];
const ts=[{id:1,side:'COMPRA',a:2365.40,b:2369.66,lot:'.03',p:'+42.6',yen:'+¥ 6,390',time:'24/10 09:12',dur:'29 min'},{id:2,side:'VENDA',a:2352.10,b:2350.26,lot:'.02',p:'-18.4',yen:'-¥ 2,760',time:'24/10 07:18',dur:'12 min'},{id:3,side:'COMPRA',a:2348.20,b:2351.06,lot:'.02',p:'+28.6',yen:'+¥ 4,290',time:'23/10 06:05',dur:'58 min'},{id:4,side:'VENDA',a:2381.80,b:2378.59,lot:'.01',p:'-32.1',yen:'-¥ 4,815',time:'23/10 22:14',dur:'2h 03m'},{id:5,side:'COMPRA',a:2330.40,b:2336.02,lot:'.03',p:'+56.2',yen:'+¥ 8,430',time:'23/10 18:26',dur:'3h 15m'}];
const title=p=>(nav.find(n=>n[0]===p)||[])[2]||'TOKAI INVEST';function go(p){S.page=p;render();scrollTo(0,0)}function h(t,s=''){return `<div class="pagehead"><div class="eyebrow">TOKAI INVEST</div><h1>${t}</h1><div class="sub">${s}</div></div>`}function alertBox(){return `<div class="alert"><b>ⓘ Ambiente demonstrativo.</b> Dados fictícios; não envia ordens e não há conexão real com MT5.</div>`}function metric(t,v,s,c=''){return `<section class="card"><h3>${t}</h3><div class="metric ${c}">${v}</div><div class="sub">${s}</div></section>`}function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}function rows(a){return a.map(t=>`<div class="listitem" onclick="S.selected=${t.id};go('details')"><div class="symbol">Au</div><div class="desc"><b><span class="pill ${t.side==='COMPRA'?'green':'red'}">${t.side}</span> XAUUSD</b><small>${t.a.toFixed(2)} → ${t.b.toFixed(2)} · ${t.time}</small></div><div style="text-align:right"><b class="${t.p[0]==='+'?'green':'red'}">${t.p} pips</b><small style="display:block">${t.yen}</small></div></div>`).join('')}
function login(){return `<div class="loginwrap"><section class="loginbox"><div class="loginlogo"><img class="school-logo" src="marca-tokai-school.png" alt="TOKAI Trade Club & School"><p>PAINEL DE ACOMPANHAMENTO XAUUSD</p></div>${alertBox()}<div class="field"><label>E-mail</label><input type="email" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input type="password" placeholder="Senha demonstrativa"></div><button class="btn goldbtn full" onclick="go('home')">Entrar</button><button class="btn full" onclick="go('home')">Explorar protótipo</button><p class="sub" style="text-align:center">Teste gratuito de 7 dias — demonstração sem cadastro real.</p></section></div>`}
function home(){return h('Visão geral','Acompanhe o robô e as operações demonstrativas do XAUUSD.')+`<div class="grid g4">${metric('ROBÔ','● Offline','MT5 não conectado','red')}${metric('XAUUSD (OURO)','2,369.66','Preço fictício')}${metric('OPERAÇÕES ABERTAS','1','Posição de exemplo')}${metric('RESULTADO DO DIA','+¥ 18,620','Resultado demonstrativo','green')}</div><div class="grid g2" style="margin-top:14px">${card('Posição atual',`<div class="row"><b><span class="pill green">COMPRA</span> XAUUSD</b><b class="green">+42.6 pips</b></div><div class="row"><span class="muted">Entrada</span><b>2,365.40</b></div><div class="row"><span class="muted">Preço atual demo</span><b>2,369.66</b></div><div class="row"><span class="muted">Lote</span><b>0.03</b></div><button class="btn goldbtn full" onclick="go('market')">Ver gráfico</button>`)}${card('Últimas operações',rows(ts.slice(0,3)))}</div>`}
function market(){return h('XAUUSD (Ouro)','Candles e operações marcadas · somente demonstração')+`<div class="grid g3">${metric('COTAÇÃO DEMO','2,369.66','USD · fictícia')}${metric('CONEXÃO','Desconectado','MT5 não conectado','red')}${metric('MARCADORES','5','Operações de exemplo')}</div>${card('Gráfico de candles',`<div class="row"><div class="tools">${['M1','M5','M15'].map(x=>`<button class="${S.tf===x?'active':''}" onclick="S.tf='${x}';render()">${x}</button>`).join('')}</div><span class="badge">DEMO</span></div><div class="chartbox"><canvas id="chart"></canvas></div><div class="legend"><span><i class="dot" style="background:#10d7a0"></i>Candle de alta</span><span><i class="dot" style="background:#ff4c64"></i>Candle de baixa</span><span><i class="dot" style="background:#10d7a0"></i>COMPRA / saída</span><span><i class="dot" style="background:#ff4c64"></i>VENDA</span></div><p class="sub">Período ${S.tf}. Velas e marcadores gerados localmente; não são cotações reais.</p>`)}<div class="grid g2" style="margin-top:14px">${card('Histórico relacionado',rows(ts.slice(0,4)))}${card('Como ler os marcadores',`<div class="row">Entrada de compra <span class="pill green">COMPRA</span></div><div class="row">Entrada de venda <span class="pill red">VENDA</span></div><div class="row">Saída da operação <span class="pill gold">SAÍDA</span></div><p class="sub">Na integração real, os marcadores virão do histórico do MT5.</p>`)}</div>`}
function draw(){let c=document.getElementById('chart');if(!c)return;let r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let W=r.width,H=r.height;x.fillStyle='#071321';x.fillRect(0,0,W,H);let L=10,R=54,T=14,B=22,cw=W-L-R,ch=H-T-B;x.strokeStyle='#1b2c40';x.fillStyle='#8297ae';x.font='10px sans-serif';for(let i=0;i<=6;i++){let y=T+ch*i/6;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText((2380-i*5).toFixed(0)+'.00',W-R+4,y+3)}for(let i=0;i<=6;i++){let a=L+cw*i/6;x.beginPath();x.moveTo(a,T);x.lineTo(a,H-B);x.stroke()}let n=S.tf==='M1'?46:S.tf==='M5'?38:30,p=2357,A=[];for(let i=0;i<n;i++){let o=p,z=p+Math.sin(i*.46)*1.05+(Math.random()-.47)*2.6,hi=Math.max(o,z)+Math.random()*1.4,lo=Math.min(o,z)-Math.random()*1.4;A.push({o,z,hi,lo});p=z}let yy=v=>T+(2382-v)/37*ch,step=cw/n,bw=Math.max(3,step*.52);A.forEach((a,i)=>{let px=L+i*step+step/2;x.strokeStyle=x.fillStyle=a.z>=a.o?'#10d7a0':'#ff4c64';x.beginPath();x.moveTo(px,yy(a.hi));x.lineTo(px,yy(a.lo));x.stroke();x.fillRect(px-bw/2,yy(Math.max(a.o,a.z)),bw,Math.max(2,yy(Math.min(a.o,a.z))-yy(Math.max(a.o,a.z))))});[{i:Math.floor(n*.22),s:'COMPRA',c:'#00bd89'},{i:Math.floor(n*.48),s:'VENDA',c:'#e83350'},{i:Math.floor(n*.7),s:'COMPRA',c:'#00bd89'},{i:Math.floor(n*.86),s:'SAÍDA',c:'#e83350'}].forEach(m=>{let a=A[m.i],px=L+m.i*step+step/2,py=yy(m.c==='#00bd89'?a.lo:a.hi),boxW=43;py=Math.max(18,Math.min(H-B-8,py+(m.c==='#00bd89'?18:-15)));x.fillStyle=m.c;x.fillRect(Math.max(L,Math.min(W-R-boxW,px-boxW/2)),py-12,boxW,14);x.fillStyle='#fff';x.font='bold 8px sans-serif';x.fillText(m.s,Math.max(L+2,Math.min(W-R-boxW+2,px-boxW/2+2)),py-2)});x.fillStyle='#8297ae';x.font='10px sans-serif';['09:00','09:15','09:30','09:45','10:00','10:15','10:30'].forEach((s,i)=>x.fillText(s,L+cw*i/6-10,H-6))}
function trades(){let arr=ts.filter(t=>S.filter==='Todas'||(S.filter==='Ganhos'?t.p[0]==='+':t.p[0]==='-'));return h('Histórico de operações','Entradas, saídas e resultados demonstrativos.')+`<div class="grid g4">${metric('OPERAÇÕES','5','Exemplos')}${metric('GANHOS','3','Fictícios','green')}${metric('PERDAS','2','Fictícias','red')}${metric('RESULTADO','+¥ 11,535','Demo','green')}</div><section class="card" style="margin-top:14px"><div class="row"><h3>Histórico</h3><div class="tools">${['Todas','Ganhos','Perdas'].map(f=>`<button class="${S.filter===f?'active':''}" onclick="S.filter='${f}';render()">${f}</button>`).join('')}</div></div><div class="tablewrap"><table class="table"><thead><tr><th>TIPO</th><th>ENTRADA → SAÍDA</th><th>LOTE</th><th>DATA</th><th>RESULTADO</th><th></th></tr></thead><tbody>${arr.map(t=>`<tr><td><span class="pill ${t.side==='COMPRA'?'green':'red'}">${t.side}</span></td><td>${t.a.toFixed(2)} → ${t.b.toFixed(2)}</td><td>${t.lot}</td><td>${t.time}</td><td class="${t.p[0]==='+'?'green':'red'}">${t.p} pips<br>${t.yen}</td><td><button class="btn" onclick="S.selected=${t.id};go('details')">Detalhes</button></td></tr>`).join('')}</tbody></table></div></section>`}
function details(){let t=ts.find(t=>t.id===S.selected)||ts[0];return h('Detalhes da operação','Informações ilustrativas completas.')+`<div class="grid g2">${card('Resumo',`<div class="row"><b><span class="pill ${t.side==='COMPRA'?'green':'red'}">${t.side}</span> XAUUSD</b><b class="${t.p[0]==='+'?'green':'red'}">${t.p} pips</b></div><div class="metric ${t.p[0]==='+'?'green':'red'}">${t.yen}</div>${[['Entrada',t.a.toFixed(2)],['Saída',t.b.toFixed(2)],['Lote',t.lot],['Horário',t.time],['Duração',t.dur],['Status','Encerrada (demo)']].map(a=>`<div class="row"><span class="muted">${a[0]}</span><b>${a[1]}</b></div>`).join('')}`)}${card('Gestão de risco',`<div class="row">Stop Loss <b>2,355.40</b></div><div class="row">Take Profit <b>2,385.40</b></div><div class="alert">Valores fictícios. Integração real ainda não existe.</div><button class="btn full" onclick="go('history')">Voltar ao histórico</button>`)}</div>`}
function signals(){return h('Sinais manuais','Registre um sinal local demonstrativo.')+`<div class="grid g2">${card('Registrar sinal',`<form onsubmit="addSignal(event)"><div class="tools"><button type="button" id="buy" class="active" onclick="document.getElementById('side').value='COMPRA';this.classList.add('active');document.getElementById('sell').classList.remove('active')">▲ COMPRA</button><button type="button" id="sell" onclick="document.getElementById('side').value='VENDA';this.classList.add('active');document.getElementById('buy').classList.remove('active')">▼ VENDA</button></div><input id="side" type="hidden" value="COMPRA"><div class="field"><label>Ativo</label><input value="XAUUSD" disabled></div><div class="field"><label>Preço de entrada</label><input id="entry" type="number" step=".01" value="2369.66" required></div><div class="field"><label>Stop Loss (opcional)</label><input id="sl" placeholder="2355.40"></div><div class="field"><label>Take Profit (opcional)</label><input id="tp" placeholder="2385.40"></div><div class="field"><label>Comentário</label><textarea id="comment" placeholder="Análise de tendência"></textarea></div><button class="btn goldbtn full">Registrar sinal demo</button><p class="sub">Não será enviado a assinantes.</p></form>`)}${card('Sinais registrados',S.manual.length?S.manual.map(s=>`<div class="listitem"><div class="desc"><b>${s.side} · XAUUSD</b><small>Entrada ${s.entry} · ${s.time}<br>${s.comment}</small></div></div>`).join(''):'<div class="empty">Nenhum sinal nesta sessão.</div>')}</div>`}
function connect(){return h('Conectar minha conta MT5','Prévia da integração futura com a corretora.')+`<div class="grid g2">${card('Corretora',`<div class="listitem"><div class="symbol">M</div><div class="desc"><b>MONAXA</b><small>MetaTrader 5</small></div><span class="pill red">Desconectada</span></div><div class="field"><label>Servidor MT5</label><input placeholder="Ex.: Monaxa-Real"></div><div class="field"><label>Login da conta</label><input placeholder="Número da conta"></div><div class="field"><label>Senha</label><input type="password" placeholder="Indisponível neste protótipo" disabled></div><button class="btn goldbtn full" onclick="alert('Integração ainda não implementada. Nenhuma credencial foi enviada.')">Verificar integração demo</button>`)}${card('Etapas futuras',`<div class="checkrow">Receber status do robô <span class="pill gold">Futuro</span></div><div class="checkrow">Sincronizar entradas e saídas <span class="pill gold">Futuro</span></div><div class="checkrow">Consultar histórico MT5 <span class="pill gold">Futuro</span></div><p class="sub">Não informe senhas reais neste protótipo.</p>`)}</div>`}
function account(){return h('Minha conta conectada','Status e informações da integração.')+`<div class="grid g2">${card('Estado da conta',`<div class="listitem"><div class="symbol">M</div><div class="desc"><b>MONAXA MT5</b><small>Conta não vinculada</small></div><span class="pill red">Offline</span></div>${[['Conta','—'],['Tipo','—'],['Saldo','—'],['Alavancagem','—']].map(a=>`<div class="row"><span class="muted">${a[0]}</span><b>${a[1]}</b></div>`).join('')}<button class="btn goldbtn full" onclick="go('connect')">Configurar conexão</button>`)}${card('Status',`<div class="empty"><div style="font-size:32px">◉</div><b>Conexão não ativa</b><p>Dados reais somente após desenvolver e validar a integração segura.</p></div>`)}</div>`}
function copyPage(){return h('Configurações de espelhamento','Interface preparada; nenhuma ordem será copiada.')+`<div class="grid g2">${card('Configurações',`<div class="checkrow">Espelhamento ativo <input class="switch" type="checkbox" ${S.copy?'checked':''} onchange="S.copy=this.checked"></div><div class="field"><label>Tipo de cópia</label><select><option>Proporcional</option><option>Mesmo lote</option><option>Lote fixo</option></select></div><div class="field"><label>Multiplicador</label><input type="number" value=".50" step=".01"></div><div class="field"><label>Limite de risco diário (¥)</label><input type="number" value="10000"></div><div class="checkrow">Copiar Stop Loss / Take Profit <input type="checkbox" class="switch" checked></div><div class="checkrow">Copiar apenas XAUUSD <input type="checkbox" class="switch" checked></div><button class="btn goldbtn full" onclick="alert('Preferências demonstrativas; nenhuma ordem será copiada.')">Salvar preferências locais</button>`)}${card('Proteções previstas',`<div class="checkrow">Limite de perda diária <span class="pill gold">Configurável</span></div><div class="checkrow">Bloqueio de outros ativos <span class="pill green">XAUUSD</span></div><div class="checkrow">Validação de risco <span class="pill gold">Obrigatória</span></div><p class="sub">A cópia real exige backend, controles de risco e testes de segurança.</p>`)}</div>`}
function notifications(){return h('Notificações','Alertas demonstrativos, não em tempo real.')+card('Central de alertas',[['↗','Nova entrada — COMPRA','XAUUSD · 2,365.40 · demo','green'],['✓','Posição encerrada — COMPRA','+42.6 pips · demo','green'],['↘','Entrada — VENDA','XAUUSD · 2,352.10 · demo','red'],['●','Robô MT5 não conectado','Aguardando integração','gold']].map(a=>`<div class="listitem"><div class="symbol">${a[0]}</div><div class="desc"><b>${a[1]}</b><small>${a[2]}</small></div><span class="pill ${a[3]}">DEMO</span></div>`).join(''))}
function profile(){return h('Perfil e menu','Gerenciamento demonstrativo.')+`<div class="grid g2">${card('Usuário TOKAI',`<div class="listitem"><div class="avatar">T</div><div class="desc"><b>Usuário de demonstração</b><small>usuario@example.com</small></div><span class="pill gold">DEMO</span></div><div class="checkrow">Minha assinatura <b class="gold">Teste demo</b></div><div class="checkrow">Contas MT5 <button class="btn" onclick="go('connect')">Configurar</button></div><div class="checkrow">Notificações <button class="btn" onclick="go('notifications')">Ver</button></div>`)}${card('Configurações',`<div class="checkrow">Idioma <b>Português (Brasil)</b></div><div class="checkrow">Ativo permitido <b>XAUUSD</b></div><div class="checkrow">Privacidade <b class="muted">A configurar</b></div><p class="sub">Sem pagamentos ou armazenamento de credenciais nesta versão.</p>`)}</div>`}
function addSignal(e){e.preventDefault();S.manual.unshift({side:document.getElementById('side').value,entry:Number(document.getElementById('entry').value).toFixed(2),comment:document.getElementById('comment').value,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});render()}
function render(){let root=document.getElementById('root');if(S.page==='login'){root.innerHTML=login();return}let fn=({home,market,trades,history:trades,details,signals,connect,account,copy:copyPage,notifications,profile})[S.page]||home;root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="mark">◈</span><div><b>TOKAI <em>INVEST</em></b><small class="brand-school">TRADE CLUB &amp; SCHOOL</small></div></div><div class="navlabel">PAINEL</div><nav class="nav">${nav.map(n=>`<button class="${S.page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join('')}</nav><div class="side-note"><b>● Modo demonstração</b><br>Dados e resultados simulados.</div></aside><main class="main"><header class="top"><strong>${title(S.page)}</strong><div style="display:flex;gap:10px;align-items:center"><span class="badge">DEMONSTRAÇÃO</span><button class="avatar" onclick="go('notifications')">♧</button></div></header><div class="content">${alertBox()}${fn()}</div></main></div><nav class="bottomnav">${['home','trades','market','history','profile'].map(id=>`<button class="${S.page===id?'active':''}" onclick="go('${id}')"><span>${nav.find(n=>n[0]===id)[1]}</span>${title(id)}</button>`).join('')}</nav>`;if(S.page==='market')draw()}
window.addEventListener('resize',()=>{if(S.page==='market')draw()});render();
</script></body></html>
