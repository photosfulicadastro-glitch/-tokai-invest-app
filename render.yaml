# Preparado para revisão; criar este serviço envolve cobrança no Render.
services:
  - type: web
    name: tokai-invest-api
    runtime: node
    plan: starter
    region: singapore
    repo: https://github.com/photosfulicadastro-glitch/-tokai-invest-app
    branch: feat/mt5-integration
    buildCommand: node --test tests/api.test.mjs
    startCommand: node server/server.mjs
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: tokai-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DB_PATH
        value: /var/data/tokai.sqlite
      - key: APP_ORIGIN
        value: https://photosfulicadastro-glitch.github.io
      - key: MT5_SOURCE
        value: principal
      - key: INGEST_TOKEN
        generateValue: true
      - key: VIEWER_TOKEN
        generateValue: true
